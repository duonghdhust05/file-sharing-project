name: FSP Industry-Standard CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Code Quality & Format Gatekeeper
  # =========================================================================
  code-formatting:
    name: Code Formatting & Static Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Ghim phiên bản clang-format: bản apt đổi theo Ubuntu (18 -> 21) làm cùng một file
      # lúc đạt lúc không. Cả nhóm cài đúng bản này: pip install clang-format==18.1.3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Clang-Format (pinned)
        run: |
          pip install clang-format==18.1.3
          clang-format --version

      - name: Verify Code Formatting
        run: |
          echo "Checking C formatting against .clang-format..."
          find include src tests -type f \( -name "*.h" -o -name "*.c" \) -exec clang-format --dry-run --Werror {} +
          echo "Code formatting check passed."

  # =========================================================================
  # 2. Build (C11 + POSIX) & Automated Test Execution
  # =========================================================================
  build-and-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.build_type }})
    needs: code-formatting
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Mã nguồn dùng POSIX socket + pthread (SDD v2.0) -> chỉ build trên Linux
        os: [ubuntu-latest]
        build_type: [Release, Debug]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Debug: bật AddressSanitizer + UndefinedBehaviorSanitizer
      - name: Configure CMake
        run: |
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            echo "Enabling AddressSanitizer and UndefinedBehaviorSanitizer..."
            cmake -B build -S . \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          else
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build All Targets (Server, Tests)
        run: |
          cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run Automated Test Suite (CTest)
        working-directory: build
        run: |
          ctest --output-on-failure -C ${{ matrix.build_type }}

      - name: Upload Test Executable Artifact (Debug Only)
        if: matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: fsp-debug-${{ matrix.os }}
          path: |
            build/fsp_server
            build/fsp_test_*
          retention-days: 7
